name: Build & publish site image

# Builds the site and publishes it to GHCR as a Caddy image. The home server polls GHCR
# and rolls out new :latest images by itself, so nothing here needs access to it.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build
        env:
          VITE_BUILD_HASH: ${{ github.sha }}

      # Caddy serves the .br sidecars via `file_server { precompressed br }`;
      # dynamic zstd/gzip covers clients without brotli support.
      - name: Precompress assets with brotli
        run: |
          sudo apt-get install -y brotli > /dev/null 2>&1 || true
          find dist -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.svg' -o -name '*.txt' \) -exec brotli -k -q 11 {} +

      - name: Stage image context
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          cp deploy/Dockerfile deploy/Caddyfile "$RUNNER_TEMP/image/"
          cp -r dist "$RUNNER_TEMP/image/site"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/image
          push: true
          tags: |
            ghcr.io/rupesh-ark/rupeshpandey:latest
            ghcr.io/rupesh-ark/rupeshpandey:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
